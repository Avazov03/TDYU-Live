# Throwaway Postgres for the hermetic browser E2E run (npm run test:e2e:full).
# Data lives in tmpfs: `docker compose -f docker-compose.e2e.yml down` discards it.
services:
  postgres-e2e:
    image: postgres:16-alpine
    container_name: lexify-postgres-e2e
    environment:
      POSTGRES_USER: lexify
      POSTGRES_PASSWORD: lexify
      POSTGRES_DB: lexify_e2e
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexify -d lexify_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

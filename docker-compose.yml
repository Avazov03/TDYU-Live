services:
  postgres:
    image: postgres:16-alpine
    container_name: opentsul-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opentsul
      POSTGRES_PASSWORD: opentsul_dev
      POSTGRES_DB: opentsul
    ports:
      - "5432:5432"
    volumes:
      - opentsul_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: opentsul-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - opentsul_redis_data:/data

volumes:
  opentsul_pg_data:
  opentsul_redis_data:
